<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>Brain in Cup</title>
  <!-- A self-contained light rim and dark tile stay legible on any tab theme. -->
  <rect x=".75" y=".75" width="30.5" height="30.5" rx="8" fill="#101426" stroke="#EAF5FF" stroke-width="1.5"/>
  <!-- Two bold brain hemispheres double as rising steam. -->
  <path d="M14.5 6.5C12 4.5 8.5 6 8.5 8.5C5.5 9 5.5 13.5 8.5 14.5H14.5V6.5Z" fill="#7AE8F4"/>
  <path d="M16.5 6.5C19 4.5 22.5 6 22.5 8.5C25.5 9 25.5 13.5 22.5 14.5H16.5V6.5Z" fill="#BDA5FF"/>
  <path d="M10 9.5C12 9.5 12.5 11 12.5 12M21 9.5C19 9.5 18.5 11 18.5 12" stroke="#101426" stroke-width="1.5" stroke-linecap="round"/>
  <!-- The handle remains open and recognizable at 16px. -->
  <path d="M23 17.5H25C29 17.5 29 23 25 23H22" stroke="#F4F7FF" stroke-width="2.5"/>
  <path d="M6 16.5H24V20C24 24.5 20.5 27 15 27S6 24.5 6 20V16.5Z" fill="#F4F7FF"/>
  <path d="M10 20V21C10 22.5 11 23.5 12.5 24" stroke="#6960BC" stroke-width="2" stroke-linecap="round"/>
</svg>
